name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Executa o notebook
        run: jupyter nbconvert --to notebook --execute modulo3_ml_saude/notebooks/modelo_snp_predicao.ipynb --output-dir /tmp/nb
